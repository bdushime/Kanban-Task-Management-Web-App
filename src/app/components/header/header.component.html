<header class="header">
  <div class="header__left">
    <!-- Mobile Logo (shown only on mobile) -->
    <img src="assets/logo-mobile.svg" alt="Kanban Logo" class="header__logo--mobile" />
    
    <div class="header__title-container" (click)="toggleMobileSidebar.emit()">
      <h1 class="header__title">{{ boardName }}</h1>
      <img src="assets/icon-chevron-down.svg" alt="" class="header__chevron" />
    </div>
  </div>
  
  <div class="header__right">
    <button class="btn btn--primary btn--large add-task-btn">
      <span class="add-task-btn__text">+ Add New Task</span>
      <img src="assets/icon-add-task-mobile.svg" alt="Add Task" class="add-task-btn__icon" />
    </button>
    <div class="header__options-container">
      <button class="header__options-btn" (click)="toggleOptionsMenu()">
        <img src="assets/icon-vertical-ellipsis.svg" alt="Options" />
      </button>

      <div class="options-menu" *ngIf="isOptionsMenuOpen">
        <button class="options-menu__item" (click)="editBoard()">Edit Board</button>
        <button class="options-menu__item options-menu__item--destructive" (click)="deleteBoard()">Delete Board</button>
      </div>
    </div>
  </div>
</header>
